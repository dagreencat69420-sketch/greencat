[package]
name = "greencat"
version = "0.1.0"
description = "GreenCat Holder App — treasuries + NFT mint + marketplace + staking + wheel VRF architecture"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "greencat"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "orao-solana-vrf/idl-build"]
# AUDIT(GC-20): mainnet build pins initialize_treasuries to the live $GC mint
# (G2b4ZNxLjgTnVtPbuHpK9WXpccFCedoLYQ5uxvdEpump). Localnet/devnet builds accept
# any mint (still gated on the program upgrade authority).
mainnet = []
# TEST-ONLY: lowers the hard floors of the VRF expiry and airdrop claim window to a
# few seconds so localnet can exercise refund/reclaim paths. Never deploy with this.
localnet-short-windows = []
# Declared so Anchor macro cfgs are "expected" under newer rustc (clippy -D warnings).
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", features = ["metadata"] }
# AUDIT(GC-15/GC-17): ORAO VRF v2 (CPI only; the off-chain `sdk` feature pulls ed25519-dalek 1.x).
orao-solana-vrf = { version = "=0.6.1", default-features = false, features = ["cpi"] }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
